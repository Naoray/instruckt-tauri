[package]
name = "tauri-plugin-instruckt"
version = "0.2.0"
edition = "2021"
description = "Tauri plugin for instruckt visual feedback annotations with MCP integration"
license = "MIT"
links = "tauri-plugin-instruckt"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "instruckt-mcp"
path = "src/bin/instruckt_mcp.rs"

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ulid = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
fs2 = "0.4"
walkdir = "2"
log = "0.4"
rmcp = { version = "1", features = ["server", "transport-io", "macros"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
